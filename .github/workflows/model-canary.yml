name: Non-blocking candidate model canary
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  candidate-canary:
    name: Non-blocking live-model evaluation
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Evaluate candidate model (skips cleanly when endpoint is not configured)
        env:
          AI_CANARY_ENDPOINT: ${{ vars.AI_CANARY_ENDPOINT }}
          AI_CANARY_API_KEY: ${{ secrets.AI_CANARY_API_KEY }}
          MODEL_CANDIDATE_VERSION: ${{ vars.MODEL_CANDIDATE_VERSION }}
          PROMPT_VERSION: ${{ vars.PROMPT_VERSION }}
        run: npm run test:canary
      - name: Retain candidate evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model-canary-${{ github.run_id }}
          path: canary-results.json
          if-no-files-found: warn
          retention-days: 30
